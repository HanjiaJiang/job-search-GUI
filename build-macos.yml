name: Build macOS App

# Runs on GitHub's own macOS runner, so no local Mac is needed. Triggers on
# every push to main and can also be started manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --windowed --collect-all playwright \
            --name "JobSearchGUI" job_search_gui.py

      - name: Zip the .app bundle
        run: |
          cd dist
          zip -r JobSearchGUI-macOS.zip JobSearchGUI.app

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: JobSearchGUI-macOS
          path: dist/JobSearchGUI-macOS.zip
